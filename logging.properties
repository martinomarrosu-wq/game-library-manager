# ============================================
# Game Library Manager — Configurazione Logging
# ============================================
# Configurazione per java.util.logging (JUL)

# Handler: scrive sia su console (ridotto) che su file (dettagliato)
handlers=java.util.logging.FileHandler, java.util.logging.ConsoleHandler

# Livello globale minimo: registra tutto da INFO in su
.level=INFO

# --- File Handler ---
# Output su file gamelibrary.log nella directory di esecuzione
java.util.logging.FileHandler.pattern=gamelibrary.log
java.util.logging.FileHandler.level=ALL
java.util.logging.FileHandler.formatter=java.util.logging.SimpleFormatter
java.util.logging.FileHandler.append=true
java.util.logging.FileHandler.limit=1048576
java.util.logging.FileHandler.count=3

# --- Console Handler ---
# In console mostriamo solo WARNING e superiori per non disturbare la CLI
java.util.logging.ConsoleHandler.level=WARNING
java.util.logging.ConsoleHandler.formatter=java.util.logging.SimpleFormatter

# Formato dei messaggi di log
java.util.logging.SimpleFormatter.format=[%1$tF %1$tT] [%4$-7s] %2$s — %5$s%6$s%n
