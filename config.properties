# ============================================
# Game Library Manager — Configurazione
# ============================================

# Percorso del file JSON dove vengono salvati i giochi
# Può essere un percorso relativo (rispetto alla directory di esecuzione)
# oppure un percorso assoluto
gamelibrary.file.path=data/gamelibrary.json

# Numero massimo di stati memorizzati dal Memento (undo)
gamelibrary.memento.max=10

# Nome dell'applicazione (usato nei log e nel menu)
gamelibrary.app.name=Game Library Manager
